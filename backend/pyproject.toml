[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiderai-backend"
version = "0.1.0"
description = "AiderAI customer-support API and worker"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "celery[redis]>=5.5,<6",
  "cryptography>=46,<51",
  "fastapi>=0.116,<1",
  "google-genai>=1.30,<2",
  "langgraph>=0.6,<2",
  "httpx>=0.28,<1",
  "pgvector>=0.4,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.10,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "redis>=6,<7",
  "sqlalchemy>=2.0.40,<3",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.hatch.build.targets.wheel]
packages = ["app"]
